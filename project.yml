name: Mindscape
options:
  bundleIdPrefix: com.youyanping
  developmentLanguage: zh-Hans
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: YES

targets:
  MindscapeTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: MindscapeTests
    dependencies:
      - target: Mindscape
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.youyanping.mindscape.tests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Mindscape.app/Contents/MacOS/Mindscape"
        BUNDLE_LOADER: "$(TEST_HOST)"

  Mindscape:
    type: application
    platform: macOS
    sources:
      - path: Mindscape
      - path: AgentSkill
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.youyanping.mindscape
        PRODUCT_NAME: Mindscape
        MARKETING_VERSION: "0.6.0-beta.2"
        CURRENT_PROJECT_VERSION: "6"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        INFOPLIST_KEY_NSHumanReadableCopyright: "© 2026 Mindscape"
        INFOPLIST_KEY_LSMinimumSystemVersion: "14.0"
        COMBINE_HIDPI_IMAGES: YES
        ENABLE_PREVIEWS: YES
        OTHER_LDFLAGS: "-lsqlite3"
        SWIFT_EMIT_LOC_STRINGS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  MindscapeCLI:
    type: tool
    platform: macOS
    sources:
      - path: MindscapeCLI
    settings:
      base:
        PRODUCT_NAME: mindscape
        PRODUCT_MODULE_NAME: MindscapeCLI
        PRODUCT_BUNDLE_IDENTIFIER: com.youyanping.mindscape.cli
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic

schemes:
  Mindscape:
    build:
      targets:
        Mindscape: all
        MindscapeTests: [test]
        MindscapeCLI: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - MindscapeTests

  MindscapeCLI:
    build:
      targets:
        MindscapeCLI: all
    run:
      config: Debug
